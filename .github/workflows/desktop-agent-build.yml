# Desktop agent 合成 build／test 的單一定義（reusable workflow）。
# 呼叫端：
# - desktop-agent-ci.yml：同 repo PR、main push、workflow_dispatch（受信任程式碼）
# - desktop-agent-ci-fork.yml：外部 fork PR，維護者加 `run-desktop-ci` label 後
#   以 pull_request_target 觸發（untrusted: true）
#
# 安全設計（fork 路徑）：
# - 私有 overlay action 與 DESKTOP_MODULES_REF 一律從「受信任 checkout」讀取：
#   github.sha 在 reusable workflow 內等於呼叫端的 sha；pull_request_target 時
#   就是 base（main）— PR 改不到 overlay action，也改不到要拉哪個私有 SHA。
# - SSH key 只出現在 overlay 那一個 step 的 env，step 結束即從磁碟刪除；
#   不使用 ssh-agent。
# - untrusted 模式不使用 pnpm cache（pull_request_target 對 main scope cache
#   本來就只有唯讀，關掉只是避免還原不必要的 cache）。
# - GITHUB_TOKEN 只有 contents: read。
# 殘餘風險：PR 程式碼（pnpm install／build／test／cargo）在私有模組已在磁碟上
# 之後執行，且同一 job 的 runner 記憶體裡仍有 secret — 惡意程式可外流私有
# 原始碼或 deploy key。這是「用私有模組測 PR 程式碼」本質上無法消除的風險，
# 所以維護者必須先逐行 review PR 再加 label（詳見 CONTRIBUTING.md）。
name: desktop-agent-build

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: 要 build 的 commit；空字串＝呼叫端預設 ref（github.sha）
        type: string
        default: ''
      untrusted:
        description: true＝外部 fork 程式碼（關 cache 等保護）
        type: boolean
        default: false
    secrets:
      AGENT_SSH_KEY:
        required: true

permissions:
  contents: read

jobs:
  combined-agent:
    name: combined-agent (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            sidecar: shioaji-x86_64-unknown-linux-gnu
            mkcert: mkcert-x86_64-unknown-linux-gnu
          - platform: windows-latest
            sidecar: shioaji-x86_64-pc-windows-msvc.exe
            mkcert: mkcert-x86_64-pc-windows-msvc.exe
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    steps:
      - name: Checkout code under test
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false
          # actions/checkout 在 pull_request_target 下預設拒絕 checkout fork 程式碼。
          # 只有 fork 路徑（untrusted）開啟：desktop-agent-ci-fork.yml 的 approved
          # job 已確認加 label 者為 write+ 維護者，且其 APPROVED review 綁定此 SHA。
          # 同 repo 路徑為 false，行為不變。
          allow-unsafe-pr-checkout: ${{ inputs.untrusted }}

      - name: Reject reserved path in code under test
        shell: bash
        run: |
          if [[ -e .ci-trusted || -L .ci-trusted ]]; then
            echo "'.ci-trusted' is reserved for CI tooling; remove it from the PR" >&2
            exit 1
          fi

      # 受信任的 CI 工具：overlay action 與私有 SHA pin。放在 workspace 子目錄
      # （checkout 會先清掉 PR 內同名目錄），overlay 完即刪除。
      - name: Checkout trusted CI tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .ci-trusted
          persist-credentials: false
          sparse-checkout: |
            /.github/
            /DESKTOP_MODULES_REF
          sparse-checkout-cone-mode: false

      - name: Read pinned desktop SHA
        id: desktop-ref
        shell: bash
        run: |
          DESKTOP_REF="$(tr -d '[:space:]' < .ci-trusted/DESKTOP_MODULES_REF)"
          if [[ ! "$DESKTOP_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "DESKTOP_MODULES_REF must contain one full commit SHA" >&2
            exit 1
          fi
          echo "sha=$DESKTOP_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned desktop modules
        uses: ./.ci-trusted/.github/actions/desktop-overlay
        with:
          ssh-key: ${{ secrets.AGENT_SSH_KEY }}
          sha: ${{ steps.desktop-ref.outputs.sha }}

      - name: Remove trusted tooling and key material
        shell: bash
        run: |
          rm -rf .ci-trusted
          rm -f ~/.ssh/agent_key

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ !inputs.untrusted && 'pnpm' || '' }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage test sidecar
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p src-tauri/binaries
          install -m 755 /bin/true "src-tauri/binaries/${{ matrix.sidecar }}"
          install -m 755 /bin/true "src-tauri/binaries/${{ matrix.mkcert }}"

      - name: Stage test sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item "$env:SystemRoot/System32/where.exe" "src-tauri/binaries/${{ matrix.sidecar }}"
          Copy-Item "$env:SystemRoot/System32/where.exe" "src-tauri/binaries/${{ matrix.mkcert }}"

      - name: Frontend production build
        run: pnpm build

      - name: Frontend tests
        run: pnpm test

      - name: Official agent plugin contract tests
        shell: bash
        run: |
          if [[ -f plugins/shioaji-pro/test/manifest-consistency.test.mjs ]]; then
            node --test plugins/shioaji-pro/test/manifest-consistency.test.mjs
          fi

      - name: Pi permission policy tests
        run: node --test src-tauri/src/pi_policy_extension.test.mjs

      - name: Pi native onboarding protocol tests
        run: node --test src-tauri/src/pi_onboarding_extension.test.mjs

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust runtime and capability tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Windows TCP owner E2E
        if: matrix.platform == 'windows-latest'
        run: cargo test --manifest-path src-tauri/Cargo.toml --test windows_tcp_owner_e2e

      - name: Windows agent Job Object E2E
        if: matrix.platform == 'windows-latest'
        run: cargo test --manifest-path src-tauri/Cargo.toml --test windows_agent_job_e2e

      # The installer hook must stop a running bundled server
      # ($INSTDIR\shioaji.exe) and leave a same-named program elsewhere alone.
      # Builds the hook into a tiny installer with the runner's NSIS and runs it
      # against two copies of ping.exe named shioaji.exe.
      - name: Windows installer hook E2E
        if: matrix.platform == 'windows-latest' && hashFiles('src-tauri/windows/hooks.nsh') != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # win25-vs2026/20261018.275 (image 20261018.275.1) does not include NSIS.
          $nsisVersion = '3.11'
          $chocoVersion = '3.11.0'
          $nsisPaths = @(
            "$env:ProgramFiles\NSIS\makensis.exe"
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          )
          $findMakensis = {
            $nsisPaths | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          }
          $makensis = & $findMakensis
          $installFailures = @()
          if (-not $makensis) {
            for ($attempt = 1; $attempt -le 4; $attempt++) {
              $log = Join-Path $env:RUNNER_TEMP "nsis-choco-$attempt.log"
              $nativeErrorPreference = $PSNativeCommandUseErrorActionPreference
              try {
                # Handle native failures ourselves so retries and ZIP fallback can run.
                $PSNativeCommandUseErrorActionPreference = $false
                choco install nsis --version=$chocoVersion -y --no-progress 2>&1 | Tee-Object -FilePath $log
                $chocoExitCode = $LASTEXITCODE
                if ($chocoExitCode -notin @(0, 1641, 3010)) {
                  $reason = (Get-Content -LiteralPath $log -Tail 20) -join "`n"
                  throw "choco exited with code ${chocoExitCode}: $reason"
                }
                $makensis = & $findMakensis
                if (-not $makensis) {
                  throw "choco exited with code $chocoExitCode but makensis.exe is missing from: $($nsisPaths -join ', ')"
                }
                break
              } catch {
                $failure = "Chocolatey attempt $attempt/4 failed: $($_.Exception.Message); log: $log"
                $installFailures += $failure
                Write-Warning $failure
                if ($attempt -lt 4) { Start-Sleep -Seconds (5 * [Math]::Pow(2, $attempt - 1)) }
              } finally {
                $PSNativeCommandUseErrorActionPreference = $nativeErrorPreference
              }
            }
          }
          if (-not $makensis) {
            $zipUrl = "https://downloads.sourceforge.net/project/nsis/NSIS%203/$nsisVersion/nsis-$nsisVersion.zip"
            # SHA256 from https://nsis-dev.github.io/release-data/versions.json (3.11 ZIP).
            $zipSha256 = 'c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1'
            $zip = Join-Path $env:RUNNER_TEMP "nsis-$nsisVersion.zip"
            $portable = Join-Path $env:RUNNER_TEMP 'nsis-portable'
            try {
              Write-Host "Chocolatey exhausted; downloading official NSIS ZIP: $zipUrl"
              Invoke-WebRequest -Uri $zipUrl -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 5 -TimeoutSec 120
              $actualSha256 = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
              if ($actualSha256 -ne $zipSha256) {
                throw "SHA256 mismatch: expected $zipSha256, got $actualSha256"
              }
              Expand-Archive -LiteralPath $zip -DestinationPath $portable -Force
              $makensis = Join-Path $portable "nsis-$nsisVersion\makensis.exe"
              if (-not (Test-Path -LiteralPath $makensis -PathType Leaf)) {
                throw "verified ZIP did not contain $makensis"
              }
            } catch {
              throw "NSIS setup failed. Chocolatey: $($installFailures -join ' | '). Official ZIP fallback ($zipUrl): $($_.Exception.Message)"
            }
          }
          Write-Host "Using makensis: $makensis"
          $base = Join-Path $env:RUNNER_TEMP "nsis hook's test"
          $inst = Join-Path $base 'inst'
          $other = Join-Path $base 'other'
          New-Item -ItemType Directory -Force $inst, $other | Out-Null
          Copy-Item "$env:SystemRoot\System32\PING.EXE" (Join-Path $inst 'shioaji.exe')
          Copy-Item "$env:SystemRoot\System32\PING.EXE" (Join-Path $other 'shioaji.exe')
          $script = Join-Path $base 'check.nsi'
          @(
            'Unicode true'
            '!include LogicLib.nsh'
            '!include x64.nsh'
            '!include "${HOOKS}"'
            'Name "hook-check"'
            'OutFile "${OUT}"'
            'RequestExecutionLevel user'
            'SilentInstall silent'
            'Section'
            '  StrCpy $INSTDIR "${TARGET}"'
            '  !insertmacro NSIS_HOOK_PREINSTALL'
            'SectionEnd'
          ) | Set-Content -Encoding utf8 $script
          $hooks = (Resolve-Path src-tauri/windows/hooks.nsh).Path
          $out = Join-Path $base 'check.exe'
          & $makensis /V2 "/DHOOKS=$hooks" "/DOUT=$out" "/DTARGET=$inst" $script
          if ($LASTEXITCODE -ne 0) { throw "makensis failed: $LASTEXITCODE" }
          $bundled = Start-Process (Join-Path $inst 'shioaji.exe') -ArgumentList '-n', '120', '127.0.0.1' -PassThru -WindowStyle Hidden
          $foreign = Start-Process (Join-Path $other 'shioaji.exe') -ArgumentList '-n', '120', '127.0.0.1' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 1
          try {
            Start-Process $out -Wait
            if (-not $bundled.WaitForExit(10000)) { throw 'bundled shioaji.exe is still running' }
            if ($foreign.HasExited) { throw 'a shioaji.exe outside the install dir was stopped' }
            # nothing left to stop: the hook is a no-op and still leaves others alone
            Start-Process $out -Wait
            if ($foreign.HasExited) { throw 'second run stopped a shioaji.exe outside the install dir' }
          } finally {
            foreach ($p in @($bundled, $foreign)) { if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force } }
          }

      - name: Rust lint
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Windows Rust compile and lint
        if: matrix.platform == 'windows-latest'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib --bins -- -D warnings
