name: Release Desktop App

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# sidecar 版本的單一來源是 repo 根目錄的 SHIOAJI_VERSION 檔 —
# app（vite define 版本握手）與這裡的下載步驟都讀同一個檔
jobs:
  # Create the draft release ONCE before the matrix fans out — when the four
  # build jobs raced to create it, GitHub happily made two releases for the
  # same tag and the assets split between them (v0.1.9 shipped without
  # Windows/mac-Intel until manually merged).
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      desktop_sha: ${{ steps.desktop.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      # 解析私有 repo main 的 SHA 一次 — 之後四個 build 全部釘同一顆，
      # build 期間私有 main 變動不會造成混版；desktop-rev.txt 供發佈
      # 追溯（下次發佈用它盤點私有側變更，見 docs/RELEASE.md）
      - name: Resolve desktop revision
        id: desktop
        env:
          AGENT_SSH_KEY: ${{ secrets.AGENT_SSH_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          # Re-run 冪等：release 已帶 desktop-rev.txt 就沿用第一輪的 SHA —
          # 重跑期間私有 main 可能已前進，重新解析會讓追溯與既有 assets 說謊
          if gh release download '${{ github.ref_name }}' --repo '${{ github.repository }}' --pattern desktop-rev.txt --output desktop-rev.txt 2>/dev/null; then
            SHA=$(sed -n '2p' desktop-rev.txt)
            echo "reusing recorded desktop revision"
          else
            mkdir -p ~/.ssh
            echo "$AGENT_SSH_KEY" > ~/.ssh/agent_key
            chmod 600 ~/.ssh/agent_key
            trap 'rm -f ~/.ssh/agent_key' EXIT
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
            SHA=$(GIT_SSH_COMMAND="ssh -i ~/.ssh/agent_key -o IdentitiesOnly=yes" git ls-remote git@github.com:Yvictor/shioaji-pro-desktop.git refs/heads/main | cut -f1)
            # 行1＝人讀契約（short SHA）；行2＝完整 SHA（build 釘定與 re-run 沿用）
            printf 'shioaji-pro-desktop@%s\n%s\n' "${SHA:0:7}" "$SHA" > desktop-rev.txt
          fi
          if [ "${#SHA}" -ne 40 ]; then
            echo "failed to resolve desktop revision (got '$SHA')" >&2
            exit 1
          fi
          PIN=$(tr -d '[:space:]' < DESKTOP_MODULES_REF)
          if [ "$SHA" != "$PIN" ]; then
            echo "release blocked: private main $SHA != DESKTOP_MODULES_REF $PIN" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          cat desktop-rev.txt
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create '${{ github.ref_name }}'             --repo '${{ github.repository }}'             --draft --title 'Shioaji Pro ${{ github.ref_name }}'             --notes-file RELEASE_NOTES.md           || echo "release already exists (re-run)"
          gh release upload '${{ github.ref_name }}'             --repo '${{ github.repository }}' desktop-rev.txt --clobber

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            sidecar: macOS-aarch64.tar.gz
            mkcert: darwin-arm64
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            target: x86_64-apple-darwin
            sidecar: macOS-x86_64.tar.gz
            mkcert: darwin-amd64
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            sidecar: Linux-x86_64.tar.gz
            mkcert: linux-amd64
            args: ''
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar: Windows-x86_64.zip
            mkcert: windows-amd64.exe
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # the desktop layer (Tauri shell + AI Agent) is closed-source — pull
      # it in via the shared overlay action, pinned to the SHA resolved once
      # in create-release（四平台保證同一顆，與 desktop-ci 共用同段邏輯）
      - name: Checkout desktop modules (private)
        uses: ./.github/actions/desktop-overlay
        with:
          ssh-key: ${{ secrets.AGENT_SSH_KEY }}
          sha: ${{ needs.create-release.outputs.desktop_sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Tag 即版本（docs/RELEASE.md）：從 tag 名解析版本注入 tauri.conf.json，
      # repo 裡不存在任何版本檔；workflow_dispatch（非 tag）沿用檔內值。
      # 單一 node 步驟四平台同路（bash + node 在所有 runner 皆可用）
      - name: Inject app version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(p, 'utf8'));
            conf.version = process.env.TAG_NAME.replace(/^v/, '');
            fs.writeFileSync(p, JSON.stringify(conf, null, 2) + '\n');
            console.log('version ->', conf.version);
          "

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Resolve sidecar version (unix)
        if: matrix.platform != 'windows-latest'
        run: echo "SHIOAJI_VERSION=$(cat SHIOAJI_VERSION | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Resolve sidecar version (windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: echo "SHIOAJI_VERSION=$((Get-Content SHIOAJI_VERSION -Raw).Trim())" >> $env:GITHUB_ENV

      - name: Download shioaji sidecar (unix)
        if: matrix.platform != 'windows-latest'
        run: |
          mkdir -p src-tauri/binaries
          curl -fsSL -o sidecar.tar.gz \
            "https://github.com/sinotrade/shioaji/releases/download/${SHIOAJI_VERSION}/shioaji-${SHIOAJI_VERSION}-${{ matrix.sidecar }}"
          tar xzf sidecar.tar.gz
          mv shioaji "src-tauri/binaries/shioaji-${{ matrix.target }}"
          chmod +x "src-tauri/binaries/shioaji-${{ matrix.target }}"

      - name: Download shioaji sidecar (windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Invoke-WebRequest -Uri "https://github.com/sinotrade/shioaji/releases/download/$env:SHIOAJI_VERSION/shioaji-$env:SHIOAJI_VERSION-${{ matrix.sidecar }}" -OutFile sidecar.zip
          Expand-Archive sidecar.zip -DestinationPath sidecar-extract
          Move-Item sidecar-extract/shioaji.exe "src-tauri/binaries/shioaji-${{ matrix.target }}.exe"

      # mkcert（BSD-3, FiloSottile/mkcert）內建為第二個 sidecar，
      # 讓「啟用本機 HTTPS」一鍵完成、user 不需自行安裝任何工具
      - name: Download mkcert sidecar (unix)
        if: matrix.platform != 'windows-latest'
        run: |
          curl -fsSL -o "src-tauri/binaries/mkcert-${{ matrix.target }}" \
            "https://github.com/FiloSottile/mkcert/releases/download/v1.4.4/mkcert-v1.4.4-${{ matrix.mkcert }}"
          chmod +x "src-tauri/binaries/mkcert-${{ matrix.target }}"

      - name: Download mkcert sidecar (windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/FiloSottile/mkcert/releases/download/v1.4.4/mkcert-v1.4.4-${{ matrix.mkcert }}" -OutFile "src-tauri/binaries/mkcert-${{ matrix.target }}.exe"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Tauri treats a present-but-empty APPLE_ID as "please notarize", so the
      # notarization env is only injected when real credentials exist.
      - name: Enable notarization (when credentials are configured)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          if [ -n "${{ secrets.APPLE_ID }}" ] && [ -n "${{ secrets.APPLE_PASSWORD }}" ]; then
            {
              echo "APPLE_ID=${{ secrets.APPLE_ID }}"
              echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
              echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
            } >> "$GITHUB_ENV"
            echo "Notarization enabled"
          else
            echo "Notarization credentials not set — signing only"
          fi

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # feature-flag service client key (publishable; baked into bundle)
          STATSIG_CLIENT_KEY: ${{ secrets.STATSIG_CLIENT_KEY }}
          # GA4 Measurement ID (publishable; baked into bundle for Realtime)
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code-signing (notarization env is injected by the step
          # above only when credentials are configured)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Shioaji Pro ${{ github.ref_name }}'
          releaseBody: |
            Shioaji Pro 桌面版 — 內建 shioaji server（sidecar）、伺服器管理介面、
            系統匣（menu bar）、自動更新。下載對應平台的安裝檔即可使用。

            macOS: .dmg ｜ Windows: .msi / .exe ｜ Linux: .AppImage / .deb / .rpm
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The matrix jobs read-modify-write latest.json concurrently, so
      # entries can race away — rebuild it deterministically from the
      # uploaded .sig assets before the release goes live.
      - name: Rebuild updater latest.json from assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/lj
          gh release download '${{ github.ref_name }}'             --repo '${{ github.repository }}'             --dir /tmp/lj --pattern '*.sig' --pattern 'latest.json'
          python3 scripts/fix-latest-json.py '${{ github.ref_name }}'             /tmp/lj '${{ github.repository }}'
          gh release upload '${{ github.ref_name }}'             --repo '${{ github.repository }}' /tmp/lj/latest.json --clobber
      - name: Publish release (all platforms assembled)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # per-release feature notes live in RELEASE_NOTES.md
          if [ -f RELEASE_NOTES.md ]; then
            gh release edit '${{ github.ref_name }}'               --repo '${{ github.repository }}' --notes-file RELEASE_NOTES.md
          fi
          gh release edit '${{ github.ref_name }}'             --repo '${{ github.repository }}' --draft=false
